<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0057b7">
<title>Передача посилання</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --blue: #0057b7; --yellow: #ffd700;
    --card: #ffffff; --text: #14213d; --muted: #5b6b86; --line: #d3dcec; --field: #f3f6fb;
    --btn: #0057b7; --btn-text: #ffffff; --ring: #0057b7; --ok: #137a3b; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #0f1b33; --text: #e9f0ff; --muted: #9db0d0; --line: #27385c; --field: #0a1426;
      --btn: #ffd700; --btn-text: #0b1a33; --ring: #ffd700; --ok: #4ade80; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    /* прапор: синє зверху, жовте знизу */
    background: linear-gradient(var(--blue) 50%, var(--yellow) 50%);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 24px 16px; flex: 1; display: flex; flex-direction: column; }

  header { display: flex; align-items: center; gap: 12px; color: #fff; margin-bottom: 20px; }
  header img { width: 44px; height: 44px; border-radius: 10px; flex: none; }
  header h1 { font-size: 22px; line-height: 1.2; margin: 0; }
  header p { margin: 2px 0 0; font-size: 14px; opacity: .85; }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--text); background: var(--card); border: 2px solid var(--card); border-radius: 10px;
  }
  .tabs button[aria-selected="true"] { background: var(--btn); color: var(--btn-text); border-color: var(--card); }

  section {
    background: var(--card); border-radius: 14px; padding: 20px 16px 16px; position: relative; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0, 20, 60, .28);
  }
  section::before { /* смужка-прапор угорі картки */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 8px;
    background: linear-gradient(var(--blue) 50%, var(--yellow) 50%);
  }
  section { padding-top: 24px; }

  label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 10px; font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
  .tabs button:focus-visible { outline-color: #fff; }
  #key { font-size: 24px; letter-spacing: .2em; text-align: center; text-transform: lowercase; }

  .go {
    width: 100%; margin-top: 16px; padding: 12px; font: inherit; font-weight: 700;
    background: var(--btn); color: var(--btn-text); border: 0; border-radius: 8px; cursor: pointer;
  }
  .go[disabled] { opacity: .6; cursor: wait; }
  .msg { margin-top: 14px; font-size: 14px; word-break: break-all; min-height: 1px; }
  .msg a { color: inherit; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .result { margin-top: 14px; padding: 12px; border: 2px dashed var(--line); border-radius: 10px; }
  .result .big { font-size: 30px; letter-spacing: .2em; font-weight: 800; text-align: center; color: var(--text); }
  .result .small { font-size: 13px; color: var(--muted); word-break: break-all; }
  .copy {
    margin-top: 8px; width: 100%; padding: 8px; font: inherit; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 12px; }

  footer {
    margin-top: auto; padding-top: 28px; text-align: center; font-weight: 700; color: #0b2a57;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .flag { /* прапор через CSS: емодзі-прапори не показуються у Windows */
    display: inline-block; width: 24px; height: 16px; border-radius: 2px; flex: none;
    background: linear-gradient(var(--blue) 50%, var(--yellow) 50%); box-shadow: 0 0 0 1px rgba(0, 0, 0, .2);
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon.png" alt="" width="44" height="44">
    <div>
      <h1>Передача посилання</h1>
      <p>Одноразово і на короткий час</p>
    </div>
  </header>

  <main>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-get" aria-selected="true" aria-controls="p-get">Завантажити</button>
      <button role="tab" id="tab-add" aria-selected="false" aria-controls="p-add">Додати</button>
    </div>

    <!-- Завантажити -->
    <section id="p-get" role="tabpanel" aria-labelledby="tab-get">
      <form id="f-get" autocomplete="off">
        <label for="key">Ключ або посилання</label>
        <input id="key" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button class="go" type="submit">Завантажити</button>
      </form>
      <div id="m-get" class="msg" role="status" aria-live="polite"></div>
      <div class="hint">Посилання одноразове: після відкриття воно видаляється.</div>
    </section>

    <!-- Додати -->
    <section id="p-add" role="tabpanel" aria-labelledby="tab-add" hidden>
      <form id="f-add">
        <label for="url">Посилання</label>
        <input id="url" type="url" placeholder="https://..." required>
        <label for="min">Час життя, хвилин</label>
        <input id="min" type="number" min="1" max="1440" value="15" required>
        <label for="pwd">Пароль</label>
        <input id="pwd" type="password" autocomplete="current-password" required>
        <button class="go" type="submit">Додати</button>
      </form>
      <div id="m-add" class="msg" role="status" aria-live="polite"></div>
      <div id="res" class="result" hidden>
        <div class="big" id="res-key"></div>
        <div class="small" id="res-info"></div>
        <button class="copy" id="copy" type="button">Копіювати коротке посилання</button>
      </div>
    </section>
  </main>

  <footer><span class="flag" aria-hidden="true"></span> Слава Україні!</footer>
</div>

<script>
  // Підставляється workflow з GitHub Variable API_URL; для локальної перевірки впишіть адресу вручну
  const API = "__API_URL__";

  const $ = (id) => document.getElementById(id);

  function show(tab) {
    const get = tab === "get";
    $("p-get").hidden = !get;  $("p-add").hidden = get;
    $("tab-get").setAttribute("aria-selected", get);
    $("tab-add").setAttribute("aria-selected", !get);
    if (get) $("key").focus();
  }
  $("tab-get").onclick = () => show("get");
  $("tab-add").onclick = () => show("add");

  function msg(id, text, cls) {
    const el = $(id);
    el.textContent = text || "";
    el.className = "msg" + (cls ? " " + cls : "");
  }

  async function call(path, body) {
    if (API.startsWith("__")) throw new Error("API не налаштовано");
    const res = await fetch(API + path, {
      method: "POST",
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
      referrerPolicy: "no-referrer",
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok) throw new Error(data.error || "Помилка " + res.status);
    return data;
  }

  // ---- Ключ із будь-чого, що вставили ----
  // Повертає null, якщо вставлено чужу адресу; інакше 5 символів ключа.
  const cleanKey = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5);
  function keyFrom(text) {
    let s = String(text || "").trim();
    // адреса без протоколу: djserega.github.io/x/#ab3k9
    if (/^[a-z0-9.-]+\.[a-z]{2,}(\/|#|$)/i.test(s)) s = "https://" + s;
    if (/^https?:\/\//i.test(s)) {
      let u;
      try { u = new URL(s); } catch { return null; }
      const trim = (p) => p.replace(/\/+$/, "");
      // посилання на цю сторінку → залишаємо лише код після #
      if (u.origin === location.origin && trim(u.pathname) === trim(location.pathname))
        return cleanKey(u.hash.slice(1));
      return null;
    }
    return cleanKey(s);
  }

  $("key").addEventListener("paste", (e) => {
    e.preventDefault();
    const k = keyFrom((e.clipboardData || window.clipboardData).getData("text"));
    if (k === null) { msg("m-get", "Це посилання не з цього сайту. Вставте ключ або посилання на цю сторінку.", "err"); return; }
    $("key").value = k;
    msg("m-get", "");
  });
  $("key").addEventListener("input", () => { $("key").value = cleanKey($("key").value); });

  // ---- Завантажити ----
  async function download(key) {
    key = cleanKey(key);
    if (!key) return;
    const btn = $("f-get").querySelector("button");
    btn.disabled = true;
    msg("m-get", "Шукаю…");
    try {
      const { url } = await call("/get/" + encodeURIComponent(key));
      history.replaceState(null, "", location.pathname);   // прибрати ключ з адреси
      msg("m-get", "Відкриваю…", "ok");
      const a = document.createElement("a");
      a.href = url; a.textContent = url; a.rel = "noreferrer";
      $("m-get").append(document.createElement("br"), a);
      location.assign(url);
    } catch (e) {
      msg("m-get", e.message, "err");
      btn.disabled = false;
    }
  }
  $("f-get").addEventListener("submit", (e) => { e.preventDefault(); download($("key").value); });

  // ---- Додати ----
  let shortLink = "";
  $("f-add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    btn.disabled = true; $("res").hidden = true;
    msg("m-add", "Додаю…");
    try {
      const r = await call("/add", {
        url: $("url").value.trim(),
        minutes: parseInt($("min").value, 10),
        password: $("pwd").value,
      });
      shortLink = location.origin + location.pathname + "#" + r.key;
      $("res-key").textContent = r.key;
      const until = new Date(r.expiresAt).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
      $("res-info").textContent = shortLink + " · діє до " + until;
      $("res").hidden = false;
      msg("m-add", "Готово", "ok");
      $("url").value = "";
    } catch (err) {
      msg("m-add", err.message, "err");
    } finally {
      btn.disabled = false;
    }
  });

  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(shortLink); msg("m-add", "Скопійовано", "ok"); }
    catch { msg("m-add", "Не вдалося скопіювати, виділіть вручну", "err"); }
  };

  // ---- Ключ в адресі: x/#ab3k9 → одразу завантажити ----
  const fromHash = cleanKey(location.hash.replace(/^#/, ""));
  if (fromHash) { $("key").value = fromHash; download(fromHash); }
  else $("key").focus();
</script>
</body>
</html>
